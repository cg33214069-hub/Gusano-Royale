<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gusanos Royale - Arena</title>
  
  <!-- 1. CARGAMOS LA LIBRERÍA OFICIAL DE SUPABASE PRIMERO -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #0b0f19; font-family: 'Segoe UI', sans-serif; color: #fff; touch-action: none; }
    #game-container { position: relative; width: 100vw; height: 100vh; }
    canvas { display: block; background: radial-gradient(circle, #121829 0%, #080b12 100%); }

    .hud-bar {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 20px; background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1); padding: 10px 24px;
      border-radius: 50px; backdrop-filter: blur(8px); z-index: 10;
    }
    .hud-item { display: flex; flex-direction: column; align-items: center; }
    .hud-label { font-size: 0.7rem; text-transform: uppercase; color: #94a3b8; }
    .hud-value { font-size: 1.2rem; font-weight: 800; color: #38bdf8; }
    .hud-value.ves { color: #4ade80; }
    .hud-value.timer { color: #fbbf24; }
    .hud-value.alive { color: #f43f5e; }

    #phase-banner {
      position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
      background: rgba(56, 189, 248, 0.15); border: 1px solid #38bdf8; color: #38bdf8;
      padding: 6px 20px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; z-index: 10;
      text-align: center; max-width: 90%;
    }

    #leave-btn {
      position: absolute; top: 15px; left: 15px; background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444; color: #ef4444; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; z-index: 10;
    }

    /* Botón de Turbo / Impulso táctil para Celular */
    #boost-btn {
      position: absolute; bottom: 30px; right: 30px; width: 80px; height: 80px;
      background: rgba(239, 68, 68, 0.35); border: 2px solid #ef4444; border-radius: 50%;
      color: #fff; font-size: 0.75rem; font-weight: bold; display: flex; justify-content: center;
      align-items: center; z-index: 10; cursor: pointer; backdrop-filter: blur(4px);
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); text-transform: uppercase;
    }
    @media (min-width: 768px) {
      #boost-btn { display: none; } /* En PC se usa la barra espaciadora */
    }

    /* Ocultamos el minimap para que el script no dé error pero no se vea la "pelota" */
    #minimap {
      display: none;
    }

    .modal-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(8, 11, 18, 0.92); display: flex; justify-content: center; align-items: center; z-index: 100;
    }
    .modal {
      background: #0f172a; border: 1px solid rgba(255, 255, 255, 0.1); padding: 25px;
      border-radius: 20px; max-width: 420px; width: 90%; text-align: center;
    }
    .modal h2 { font-size: 1.8rem; margin-bottom: 10px; color: #38bdf8; }
    .btn-primary { background: #22c55e; color: #fff; border: none; padding: 12px 28px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
  </style>
</head>
<body>

<div id="game-container">
  <!-- Botón de abandonar seguro -->
  <button id="leave-btn" onclick="abandonarPartida()">Abandonar</button>

  <div class="hud-bar">
    <div class="hud-item"><span class="hud-label" id="timer-label">Preparación</span><span class="hud-value timer" id="timer-display">00:10</span></div>
    <div class="hud-item"><span class="hud-label">Mi Botín</span><span class="hud-value ves" id="ves-display">0 VES</span></div>
    <div class="hud-item"><span class="hud-label">Vivos</span><span class="hud-value alive" id="alive-display">100 / 100</span></div>
  </div>

  <div id="phase-banner">FASE DE PREPARACIÓN: Ubícate en el mapa</div>

  <canvas id="gameCanvas"></canvas>
  <canvas id="minimap"></canvas>

  <!-- Botón táctil de Turbo para Celular -->
  <button id="boost-btn">TURBO</button>

  <!-- Modal de Fin de Partida -->
  <div class="modal-overlay" id="end-modal" style="display: none;">
    <div class="modal">
      <h2 id="end-title">FIN DE LA PARTIDA</h2>
      <p id="end-desc"></p>
      <div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; margin: 20px 0;">
        <div style="font-size: 0.8rem; color: #94a3b8;">BOTÍN FINAL RETIRADO</div>
        <div style="font-size: 2rem; font-weight: 800; color: #4ade80;" id="end-ves-amount">0 VES</div>
      </div>
      <button class="btn-primary" onclick="window.location.href='dashboard.html'">VOLVER AL PANEL</button>
    </div>
  </div>
</div>

<script>
  // Inicialización del cliente Supabase
  const SUPABASE_URL = 'https://odecdkuwbkcvqekuekoc.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9kZWNka3V3YmtjdnFla3Vla29jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzMTQzNDIsImV4cCI6MjEwODg5MDM0Mn0.Hi8GemXv6_ZDyBTPwJVqwAABlQ24smArzNhATaRYs7A';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  window.isPreparingTimerActive = true;
  setTimeout(() => { window.isPreparingTimerActive = false; }, 10000);

  function abandonarPartida() {
    if (confirm("¿Estás seguro de abandonar la partida? Perderás el dinero de la entrada.")) {
      localStorage.removeItem('selected_entry');
      window.location.href = 'dashboard.html';
    }
  }

  // FUNCIÓN OPTIMIZADA PARA SUMAR GANANCIAS EN SUPABASE
  async function finishGameAndReward(amountWon) {
    const userId = localStorage.getItem('user_id');
    const userEmail = localStorage.getItem('user_email');
    
    if (!userId && !userEmail) {
      alert("Sesión no válida para acreditar el premio.");
      window.location.href = 'dashboard.html';
      return;
    }

    // 1. Obtener balance actual del perfil por id o email
    let query = supabaseClient.from('profiles').select('id, balance');
    if (userId) {
      query = query.eq('id', userId);
    } else {
      query = query.eq('email', userEmail);
    }

    const { data: profile, error: errFetch } = await query.maybeSingle();

    if (errFetch || !profile) {
      console.error("Error cargando perfil:", errFetch);
      alert("No se pudo obtener tu perfil para sumar las ganancias.");
      return;
    }

    const currentBalance = Number(profile.balance || 0);
    const newBalance = currentBalance + Number(amountWon);

    // 2. Actualizar el saldo una sola vez
    const { error: errUpdate } = await supabaseClient
      .from('profiles')
      .update({ balance: newBalance })
      .eq('id', profile.id);

    if (errUpdate) {
      alert("Error guardando el saldo en Supabase: " + errUpdate.message);
    } else {
      document.getElementById('end-ves-amount').innerText = `${Number(amountWon).toLocaleString('es-VE')} VES`;
      document.getElementById('end-modal').style.display = 'flex';
    }
  }
</script>

<!-- 2. ENLAZAMOS LA LÓGICA DEL JUEGO -->
<script src="script.js"></script>
</body>
</html>
